AWSTemplateFormatVersion: "2010-09-09"
Description: NurManOS H1 bounded agentic-memory API in eu-west-1

Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  DatabaseSecretArn:
    Type: String
  FrontendOrigin:
    Type: String
    AllowedPattern: "^https://[a-z0-9.-]+$"
  ConverseModelId:
    Type: String
    Default: eu.amazon.nova-micro-v1:0
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Resources:
  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/nurmanos-h1-agent
      RetentionInDays: 7

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/nurmanos-h1-agent
      RetentionInDays: 7

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: NurManOSH1AgentRuntimeRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BoundedRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${AgentLogGroup.Arn}:*"
              - Sid: ReadOnlyH1DatabaseSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
              - Sid: InvokeOnlyRequiredModels
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/${ConverseModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-micro-v1:0"

  AgentFunction:
    Type: AWS::Lambda::Function
    DependsOn: AgentLogGroup
    Properties:
      FunctionName: nurmanos-h1-agent
      Description: Bounded synthetic-memory agent for Aurora Demo Unit
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 28
      ReservedConcurrentExecutions: 2
      Role: !GetAtt AgentRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref FrontendOrigin
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          CONVERSE_MODEL: !Ref ConverseModelId
          EMBEDDING_MODEL: !Ref EmbeddingModelId
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: nurmanos-h1-agent-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 300

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AgentFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/health
      Target: !Sub integrations/${LambdaIntegration}

  AgentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/agent
      Target: !Sub integrations/${LambdaIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 3
        ThrottlingRateLimit: 1
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLatency":"$context.responseLatency"}'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AgentFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  AgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: H1 Lambda returned two or more errors in five minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AgentThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: H1 Lambda throttling indicates public capacity pressure
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AgentDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: H1 Lambda p95 duration exceeded fifteen seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref AgentFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 15000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: H1 HTTP API returned three or more server errors in five minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: $default
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionName:
    Value: !Ref AgentFunction
  RuntimeRoleArn:
    Value: !GetAtt AgentRole.Arn
  ApiAccessLogGroupName:
    Value: !Ref ApiAccessLogGroup
